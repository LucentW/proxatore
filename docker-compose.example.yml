services:
  proxatore:
    image: ghcr.io/lucentw/proxatore:main
    # build:
    #  context: .
    #  dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - 8080:8080
    volumes:
      # history DB + media cache; the host dir must be writable by uid 65534 (nobody)
      - ./data:/var/lib/proxatore
    depends_on:
      - cobalt

  cobalt:
    image: ghcr.io/imputnet/cobalt:11
    init: true
    read_only: true
    restart: unless-stopped
    environment:
      API_URL: "http://cobalt:9000/"
